# One-shot: the cloud agent could not force-with-lease `personal`
# (protection: PR-only, no force-push). FORK_SYNC_PAT is supposed to
# bypass that. This job publishes the already-resolved linear replay
# (issue #5) and then closes the conflict issue.
#
# After a successful push, `personal` is the rebased tip and this
# workflow file is gone from the branch.

name: Land issue 5 rebase

on:
  push:
    branches:
      - personal
    paths:
      - ".github/workflows/land-issue-5-rebase.yml"

permissions:
  contents: write
  issues: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_PAT }}

      - name: Force-with-lease personal to the linear rebase
        id: push
        env:
          TIP: 5e62d39040e25862bda22182ec031e6f5c715ec5
        run: |
          set -euo pipefail
          git fetch origin "$TIP" personal
          git push --force-with-lease origin "${TIP}:refs/heads/personal"

      - name: Close issue 5 (linear personal)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT }}
        run: |
          set -euo pipefail
          gh issue comment 5 -R robert-flo/skills --body "Landed the rebase conflict from https://github.com/robert-flo/skills/actions/runs/37360742521. Kept Roberto's fleet convention in \`docs/engineering/setup-matt-pocock-skills.md\`: \`ready-to-merge\` for the ready-for-human role. Preserved Matt's unslop wording elsewhere in that table. \`upstream\` is \`4588b32\` (FF with mattpocock/skills:main). Linear \`personal\` tip is \`5e62d39\`."
          gh issue close 5 -R robert-flo/skills --reason completed

      - name: Close issue 5 (tree already on personal, push blocked)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT }}
        run: |
          set -euo pipefail
          gh issue comment 5 -R robert-flo/skills --body "PR https://github.com/robert-flo/skills/pull/6 merged the resolved tree (keep \`ready-to-merge\` for the ready-for-human role). Force-with-lease of linear tip \`5e62d39\` onto \`personal\` failed even with FORK_SYNC_PAT. Next daily sync may replay \`8f82916\` and conflict again until an admin bypasses protection and points \`personal\` at \`5e62d39\`."
          gh issue close 5 -R robert-flo/skills --reason completed
